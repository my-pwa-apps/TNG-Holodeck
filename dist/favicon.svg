<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Holodeck amber grid (4×4 cells) -->
  <!-- Vertical lines -->
  <line x1="8"  y1="0"  x2="8"  y2="32" stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <line x1="16" y1="0"  x2="16" y2="32" stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <line x1="24" y1="0"  x2="24" y2="32" stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <!-- Horizontal lines -->
  <line x1="0"  y1="8"  x2="32" y2="8"  stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <line x1="0"  y1="16" x2="32" y2="16" stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <line x1="0"  y1="24" x2="32" y2="24" stroke="#FFB300" stroke-width="0.8" opacity="0.9"/>
  <!-- Intersection node highlights -->
  <circle cx="8"  cy="8"  r="1.4" fill="#FFB300"/>
  <circle cx="16" cy="8"  r="1.4" fill="#FFB300"/>
  <circle cx="24" cy="8"  r="1.4" fill="#FFB300"/>
  <circle cx="8"  cy="16" r="1.4" fill="#FFB300"/>
  <circle cx="16" cy="16" r="2.0" fill="#FFB300" opacity="0.95"/>
  <circle cx="24" cy="16" r="1.4" fill="#FFB300"/>
  <circle cx="8"  cy="24" r="1.4" fill="#FFB300"/>
  <circle cx="16" cy="24" r="1.4" fill="#FFB300"/>
  <circle cx="24" cy="24" r="1.4" fill="#FFB300"/>
</svg>
